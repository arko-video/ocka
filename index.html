<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <!--
      Politique de sécurité (CSP) : la page ne charge que ses propres fichiers et n'appelle aucun site.
      - script-src 'self' : nos fichiers JS et nos modules AudioWorklet (enregistrement de la voix, master).
        'wasm-unsafe-eval' : SEULEMENT la compilation de WebAssembly (secours AAC pour le M4A quand le téléphone n'a
        pas d'encodeur AAC). Il ne permet ni eval() ni new Function().
      - style-src 'unsafe-inline' : Vite injecte le CSS en dev ; l'appli n'insère jamais de HTML venu d'ailleurs.
      - media-src blob: : écoute des prises de voix et des exports.
      - worker-src 'self' blob: : Workers d'OCKA, service worker, et le Worker de l'encodeur AAC en WebAssembly
        (créé depuis un blob: par la bibliothèque).
      - connect-src : en plus de 'self', SEULEMENT les 3 fournisseurs d'IA (Anthropic, OpenAI, Gemini), appelés
        depuis la page après un toucher, avec la clé de l'utilisateur (IA facultative, phase 6). Aucun autre site.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' blob: data:; media-src blob:; worker-src 'self' blob:; connect-src 'self' https://api.anthropic.com https://api.openai.com https://generativelanguage.googleapis.com; manifest-src 'self'; base-uri 'none'; form-action 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0E0B14" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="Fais tes beats, pose ta voix, sors tes morceaux sur Spotify. Gratuit, open source, rien n'est envoyé en ligne." />
    <link rel="icon" type="image/png" sizes="192x192" href="/icones/icone-192.png" />
    <title>OCKA</title>
    <style>
      html,
      body {
        background: #0e0b14;
        color: #f4f2f8;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <noscript>OCKA a besoin de JavaScript pour fonctionner.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
